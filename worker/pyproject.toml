[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dna-entropy"
version = "0.0.1"
description = "Per-position information entropy of DNA via the Evo 2 genomic language model, exported for IGV."
# No `readme` field: `README.legacy.md` describes the retired gcloud/keeper prototype
# workflow (see worker/legacy/dna-entropy-v1/ and worker/legacy/cloud/) and would be
# misleading as this package's PyPI-style readme. The worker's real docs live under
# docs/science_and_formats.md (see docs/migration/2026-09-19-worker-migration-inventory.md,
# "worker/README.legacy.md" row) once that lands; point `readme` at it then.
requires-python = ">=3.10"
# Core deps stay light so the mock-predictor pipeline installs and runs with no GPU.
# Biopython is pure-Python (+ numpy, already a dep) and powers GenBank/FASTA I/O, which
# is now core functionality — not a heavy GPU extra.
dependencies = [
    "numpy>=1.24",
    "typer>=0.9",
    "biopython>=1.81",
]

[project.optional-dependencies]
# Dev: laptop / CI, no GPU needed.
# hypothesis is MPL-2.0, NOT MIT/Apache/BSD (MEASURED 2026-09-19 against PyPI's own
# license_expression metadata; issue #368's own body assumed MIT without checking, which
# is exactly the mistake Hard Rule 21 exists to catch before a dependency lands, not
# after). Hard Rule 21's own text scopes the MIT/Apache/BSD requirement to "anything that
# ships" -- this extra is explicitly dev/CI-only and is never installed into the
# container image (see the comment on `dev` above and worker/Dockerfile.cpu/.cuda, which
# install core + `[evo]` only, never `[dev]`). docs/hard_rules.md's own carve-out section
# says no dev-only-dependency carve-out is currently recorded (unlike the donor project's
# own dev-only MPL-2.0 precedent) and that one needs a DECISION issue rather than a silent
# addition here -- see DECISION issue filed this session (worker: hypothesis is dev-only
# and MPL-2.0, not MIT; scope Hard Rule 21 to shipped code or record a carve-out).
dev = ["pytest>=7", "jsonschema>=4", "hypothesis>=6.100"]
# Evo: GPU box only (see docs/EVO_SETUP.md). Heavy; never a core dep.
evo = ["torch", "evo2"]
# Gene boundaries (optional, prokaryotic).
genes = ["pyrodigal>=3"]
# No `package`/pyinstaller extra: the worker ships as a container image (design D6),
# not a double-click .exe. `worker/packaging/build_exe.ps1` and `worker/*.spec` stay as
# REFERENCE only (see docs/migration/2026-09-19-worker-migration-inventory.md) for their
# torch/evo2/flash-attn/pyrodigal exclude-list discipline, but are not part of any install.

[project.scripts]
dna-entropy = "dna_entropy.cli:main"
# The container's own entrypoint (worker/vm/startup.sh, issue #45; the -cpu/-cuda images,
# issue #36) — a separate console script from `dna-entropy` because `run`'s exit-code
# contract (0/2/3/10/11, see worker/src/dna_entropy/worker/cli.py) is specific to the
# startup script's cleanup dispatch, not the human-facing science CLI.
dna-entropy-worker = "dna_entropy.worker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# GPU/Evo tests are marked and skip themselves when no CUDA stack is present.
# Plain `pytest` runs everything; on the laptop use `pytest -m "not gpu"`.
markers = [
    "gpu: requires a CUDA GPU and the Evo stack (skipped without one)",
]

[tool.ruff]
# `ci-worker.yml` turns `ruff check`/`ruff format --check` on the moment this table
# exists (issue #38) — this is a decision to lint the WHOLE package in one commit, a
# prototype that had never been linted before. Findings were fixed, not hidden; see the
# per-rule notes below for anything genuinely disabled, each with its own reason.
line-length = 110  # generous enough that worker/src/dna_entropy/cli.py's typer.Option
# declarations (one flag = one call, deliberately not split across many tiny lines so the
# whole flag definition — name, default, help text — stays scannable in one place) fit
# after a light rewrap, without forcing this package into black's 88-column convention,
# which several genuinely wide numpy broadcasting/windowing expressions would fight.
target-version = "py310"  # matches `requires-python = ">=3.10"` above

# worker/legacy/ and worker/docs-legacy/ are untouched, byte-for-byte copies of retired
# prototype code, kept ONLY as historical reference (see
# docs/migration/2026-09-19-worker-migration-inventory.md) — linting or reformatting them
# would defeat the point of keeping them unchanged. worker/packaging/ is REFERENCE-only
# PyInstaller tooling that ships nothing and nobody runs day to day.
extend-exclude = ["legacy", "docs-legacy", "packaging"]

[tool.ruff.lint]
# A rule set picked for a scientific Python package with real GPU/cloud contracts, not a
# generic library:
#   E, F   - pycodestyle errors / pyflakes: real bugs (undefined names, unused imports,
#            syntax-adjacent mistakes), the non-negotiable baseline.
#   I      - isort: one consistent import order, autofixable, zero judgment calls.
#   UP     - pyupgrade: modernize syntax for the `requires-python = ">=3.10"` floor this
#            package already declares (e.g. drop now-redundant quoted annotations under
#            `from __future__ import annotations`).
#   B      - flake8-bugbear: catches exactly the "written fast, never reviewed" mistake
#            shapes this codebase was flagged as being at risk of (mutable default
#            arguments, loop variables captured by a closure, etc.).
#   SIM    - flake8-simplify: nudges toward the more readable of two equivalent forms
#            without being prescriptive about anything scientific code actually needs.
# Deliberately NOT selected:
#   ANN (type-annotation-required) - this package documents its contracts in prose and
#     enforces them at runtime (predictors/base.py's check_probability_matrix(), the
#     windowing/direction dataclasses), not with mypy; requiring an annotation on every
#     argument everywhere is churn without a type checker in CI to make it pay off.
#   D (pydocstyle format rules) - this codebase's docstrings are thorough prose explaining
#     WHY, not machine-checkable Google/NumPy-style API docs; reformatting hundreds of
#     them to satisfy a formatter's opinion on docstring punctuation is not worth the diff.
#   PL (pylint) - extremely opinionated, high false-positive rate on numpy-broadcasting-
#     heavy code (too-many-arguments on a dataclass field list, etc.).
#   C90 (mccabe complexity) - the windowing/direction combination logic
#     (analysis/direction.py's _combine) is legitimately branchy science with a real
#     truth table behind it, not a code smell to flatten.
#   S (flake8-bandit) - security-linting a local science/CLI tool with no user-supplied
#     code execution surface produces mostly false positives (subprocess/tempfile
#     patterns that are fine here); the one place this would matter (the worker's own
#     HTTP calls to GCS/Compute) is already hand-reviewed in blobstore.py/lifecycle.py's
#     docstrings, not something a linter's generic bandit rules would catch anyway.
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = [
    # B008: typer's whole API is "call typer.Option(...) as an argument default" — that
    # IS the framework's documented pattern (Options are evaluated once at import time by
    # design, not per-call like a mutable-default bug), not the footgun this rule exists
    # to catch elsewhere.
    "B008",
]

[tool.ruff.lint.isort]
# dna_entropy's own submodules (predictors, readers, writers, analysis, worker, ...) count
# as first-party, not third-party, so `from .foo import Bar` sorts with the local-import
# group even when a file is deep enough that `.` alone doesn't make that obvious.
known-first-party = ["dna_entropy"]

[tool.ruff.format]
# No overrides beyond `line-length`/`target-version` above — ruff format's defaults
# (double quotes, trailing commas, LF) already match this codebase's existing style
# (CLAUDE.md hard rule: ASCII console + UTF-8/LF).
