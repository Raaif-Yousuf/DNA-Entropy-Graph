[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dna-entropy"
version = "0.0.1"
description = "Per-position information entropy of DNA via the Evo 2 genomic language model, exported for IGV."
# No `readme` field: `README.legacy.md` describes the retired gcloud/keeper prototype
# workflow (see worker/legacy/dna-entropy-v1/ and worker/legacy/cloud/) and would be
# misleading as this package's PyPI-style readme. The worker's real docs live under
# docs/science_and_formats.md (see docs/migration/2026-09-19-worker-migration-inventory.md,
# "worker/README.legacy.md" row) once that lands; point `readme` at it then.
requires-python = ">=3.10"
# Core deps stay light so the mock-predictor pipeline installs and runs with no GPU.
# Biopython is pure-Python (+ numpy, already a dep) and powers GenBank/FASTA I/O, which
# is now core functionality — not a heavy GPU extra.
dependencies = [
    "numpy>=1.24",
    "typer>=0.9",
    "biopython>=1.81",
]

[project.optional-dependencies]
# Dev: laptop / CI, no GPU needed.
dev = ["pytest>=7", "jsonschema>=4"]
# Evo: GPU box only (see docs/EVO_SETUP.md). Heavy; never a core dep.
evo = ["torch", "evo2"]
# Gene boundaries (optional, prokaryotic).
genes = ["pyrodigal>=3"]
# No `package`/pyinstaller extra: the worker ships as a container image (design D6),
# not a double-click .exe. `worker/packaging/build_exe.ps1` and `worker/*.spec` stay as
# REFERENCE only (see docs/migration/2026-09-19-worker-migration-inventory.md) for their
# torch/evo2/flash-attn/pyrodigal exclude-list discipline, but are not part of any install.

[project.scripts]
dna-entropy = "dna_entropy.cli:main"
# The container's own entrypoint (worker/vm/startup.sh, issue #45; the -cpu/-cuda images,
# issue #36) — a separate console script from `dna-entropy` because `run`'s exit-code
# contract (0/2/3/10/11, see worker/src/dna_entropy/worker/cli.py) is specific to the
# startup script's cleanup dispatch, not the human-facing science CLI.
dna-entropy-worker = "dna_entropy.worker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# GPU/Evo tests are marked and skip themselves when no CUDA stack is present.
# Plain `pytest` runs everything; on the laptop use `pytest -m "not gpu"`.
markers = [
    "gpu: requires a CUDA GPU and the Evo stack (skipped without one)",
]
