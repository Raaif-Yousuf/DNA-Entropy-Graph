name: ci-docs

# Runs on every pull request, plus on demand:
#
#     gh workflow run ci-docs.yml
#     gh run watch
#
# or the "Run workflow" button on the Actions tab. No path filter - the guards, the
# link check and the changelog-fragment check all read across the whole tree, not just
# docs/, so a PR that never touches docs/ can still break one of them. No push trigger
# and no schedule - a PR's own check is the gate.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guards:
    name: repo guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The private-donor and AGENTS.md-stub rules live in scripts/check_repo_hygiene.py, run by the
      # glob loop in the `checks` job and self-tested by scripts/tests (#449). They were inline shell
      # here with no way to prove they could fail.

      # A user-home path in a tracked file leaks a real person's account name and
      # breaks the file for everyone else. The guard lives in scripts/ so it can be
      # run locally with the same code CI runs, and it self-tests both arms.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: The user-home guard still says no to a real path
        run: python scripts/check_user_home_paths.py --self-test

      - name: No absolute user-home paths in tracked files
        run: python scripts/check_user_home_paths.py

      # The em-dash rule (Hard Rule 13) is scripts/check_em_dash.py, run by the glob loop in
      # the `checks` job below and self-tested by scripts/tests/test_check_em_dash.py. It was an
      # inline git grep here until #425, with no way to prove it could fail.

  checks:
    name: docs consistency checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history on purpose. check_totest_format.py validates that the closing sha in
      # every ToTest row is a commit this repo actually has, and the default shallow
      # clone (depth 1) does not have it, so every row failed with "not a commit this
      # repo has". The check is right; the clone was wrong.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Each check enables itself when its script lands, so this job tightens
      # automatically rather than needing a workflow edit per issue.
      #
      # scripts/check_third_party_notices.py is EXCLUDED from this loop (2026-09-19,
      # issue #34): unlike every other check_*.py here, it needs a real `dotnet` CLI
      # (to enumerate app/'s NuGet tree) and worker/.venv (to read installed Python
      # package licences) - neither exists on this bare ubuntu-latest + setup-python job,
      # and worker/.venv is gitignored so no checkout ever has it ready-made. Running it
      # here would not silently pass (this is not the false-pass shape it used to be
      # before #34); it would CRASH on "dotnet: command not found", which is a worse
      # failure than simply not running yet - a confusing, unhelpful red build that
      # teaches people to route around this loop rather than fix a real licence problem.
      # It runs in .github/workflows/ci-notices.yml instead (windows-latest, dotnet SDK plus the
      # locked worker venv; issue #416), and locally via scripts/premerge.py in full mode. This
      # exclusion stays: this ubuntu job still cannot run it.
      - name: Run every scripts/check_*.py that exists (except third-party-notices, see above)
        run: |
          shopt -s nullglob
          found=0
          for script in scripts/check_*.py; do
            if [ "$script" = "scripts/check_third_party_notices.py" ]; then
              echo "::notice title=skipped check_third_party_notices.py::needs dotnet + worker/.venv, not set up on this job (issue filed; see this step's own comment in ci-docs.yml)."
              continue
            fi
            found=1
            echo "::group::$script"
            python "$script"
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "::notice title=no checks yet::scripts/check_*.py does not exist yet (issues #25 to #33)."
          fi

      # Presence (#429): behaviour files changed but no fragment was added.
      - name: Changelog fragment present
        if: github.event_name == 'pull_request'
        run: python scripts/check_changelog_fragments.py --base "origin/${{ github.base_ref }}"

      - name: Changelog fragment shape
        run: |
          if [ -f scripts/compile_sprint_log.py ]; then
            python scripts/compile_sprint_log.py --check
          else
            echo "::notice title=changelog check skipped::scripts/compile_sprint_log.py does not exist yet (issue #272)."
          fi

  # scripts/tests/ covers the repo-safety hooks, the memory sync's secret scan, the label
  # sync and every check_*.py guard. Until issue #311 it ran nowhere in CI: the guards
  # that protect this repo were themselves only ever checked by a human typing pytest.
  scripts-tests:
    name: scripts tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: some of these tests exercise git-aware code paths.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # Lint first (#430): scripts/ruff.toml is the config; the guards are the last place to be unmaintained.
      - name: ruff check scripts
        run: uvx ruff check scripts
      - name: pytest scripts/tests
        run: uv run --with pytest --with pyyaml python -m pytest scripts/tests -q

  links:
    name: markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # Offline: local file links only. External links change under us and would
          # make an unrelated PR red.
          #
          # Excluded on purpose:
          #   legacy/**, worker/legacy/**, worker/*.legacy.md, worker/docs-legacy/**
          #     Frozen copies of the prototypes. Their links point at the prototype's own
          #     tree and are wrong here by construction; rewriting them would falsify the copy.
          #   docs/superpowers/specs/**
          #     A spec describes the repo we are building, so it links to docs that do not
          #     exist yet. Those links are checked by docs/README.md's index instead
          #     (scripts/check_docs_index.py, issue #25) once the docs set lands.
          args: >-
            --offline --no-progress --include-fragments
            --exclude-path legacy
            --exclude-path worker/legacy
            --exclude-path worker/docs-legacy
            --exclude-path docs/superpowers/specs
            --exclude-path worker/CLAUDE.legacy.md
            --exclude-path worker/README.legacy.md
            './**/*.md'
          fail: true
