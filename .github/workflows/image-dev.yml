# Dev worker image: build worker/Dockerfile.{cuda,cpu} from ANY branch by hand and push it to ghcr.io, so a first real GPU run
# (scripts/cloud_gpu_test.ps1 -Apply -Image <digest>) does not wait for a signed release. docs/release_runbook.md, "Dev worker image".
#
# What this is NOT: a release. No signing, no OAuth client, no Velopack, no environment, no secret except the workflow's own
# GITHUB_TOKEN (packages: write, to push). The tag is `dev-<shortsha>-<variant>`; a released app never reads it, because
# worker-images.json is written only by release.yml. The app runs it only with developer mode + the `worker_image` setting.
# No Trivy, SBOM or attestation here: those are release.yml's gate. #255 (reproducible base/lock pins) edits the Dockerfiles and
# release.yml, not this file; whichever lands first, the other merges without a conflict, and this build then uses its pins.
#
# Run: Actions > "image-dev" > Run workflow (pick the branch), or `gh workflow run image-dev.yml --ref <branch> -f variant=cuda`.
# The workflow file must exist on the default branch before it can be dispatched at all.
#
# Every action is pinned by commit SHA (scripts/check_actions_pinned.py); the SHAs are release.yml's. Structure pinned by
# scripts/tests/test_image_dev_workflow.py.
name: image-dev

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Which image to build'
        type: choice
        options:
          - cuda
          - cpu
          - both
        default: cuda

permissions:
  contents: read

concurrency:
  group: image-dev
  cancel-in-progress: false

env:
  IMAGE_REPO: ghcr.io/raaif-yousuf/dna-entropy-worker

jobs:
  # The `choice` type is enforced only by the web UI; `gh workflow run -f variant=...` and the REST API accept any string. So the
  # value is checked here, in shell, before it can reach a matrix or a tag.
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - name: validate variant and build the matrix
        id: m
        env:
          VARIANT: ${{ inputs.variant }}
        run: |
          case "$VARIANT" in
            cuda) matrix='["cuda"]' ;;
            cpu) matrix='["cpu"]' ;;
            both) matrix='["cuda","cpu"]' ;;
            *) echo "::error title=Bad variant::variant must be cuda, cpu or both. Re-run with one of those."; exit 1 ;;
          esac
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  image:
    name: image ${{ matrix.variant }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The NGC PyTorch base is about 10 GB compressed and far more unpacked; an ubuntu runner has about 14 GB free until these
      # are removed (same step as release.yml).
      - name: free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: set up buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: log in to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Tags are mutable, so the run id and attempt are in the name: a re-dispatch of the same commit never overwrites an earlier
      # dev tag. The tag is a label for humans; ONLY the digest is ever used to run an image.
      - name: tag
        id: sha
        run: echo "tag=dev-${GITHUB_SHA::7}-r${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: worker
          file: worker/Dockerfile.${{ matrix.variant }}
          tags: ${{ env.IMAGE_REPO }}:${{ steps.sha.outputs.tag }}-${{ matrix.variant }}
          provenance: false
          sbom: false
          push: true

      - name: print the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VARIANT: ${{ matrix.variant }}
          TAG: ${{ steps.sha.outputs.tag }}
        run: |
          ref="${IMAGE_REPO}@${DIGEST}"
          {
            echo "### dev worker image ($VARIANT)"
            echo
            echo "Commit: \`${GITHUB_SHA}\` on \`${GITHUB_REF_NAME}\`, tag \`$TAG-$VARIANT\` (a label only; tags are mutable)"
            echo
            echo "Digest: \`$DIGEST\`"
            echo
            echo "Use ONLY the digest reference (developer mode only):"
            echo
            echo '```'
            echo "scripts/cloud_gpu_test.ps1 -Apply -Image $ref -Lifecycle delete"
            echo '```'
            echo
            echo "First push of a new package is PRIVATE. Before making it public, read docs/release_runbook.md section 6b: everything COPYed from worker/ becomes world-readable."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$ref"
