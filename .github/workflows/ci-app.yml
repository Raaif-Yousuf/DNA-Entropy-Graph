name: ci-app

# On demand only, for now:
#
#     gh workflow run ci-app.yml
#     gh run watch
#
# or the "Run workflow" button on the Actions tab. No push trigger and no schedule.
#
# This workflow is the one that is NOT yet on pull requests, unlike ci-worker and
# ci-docs, and the reason is measured rather than a preference. MEASURED 2026-09-20:
# its `test` step hangs on windows-latest. Three runs, all cancelled by hand after the
# step had been running for between six and twenty-five minutes:
#
#   35528323292  solution-wide `dotnet test`                     hung
#   35529823866  solution-wide `dotnet test`                     hung
#   35530219025  five library projects, no WinUI-hosted assembly hung
#
# The same commands finish in about 25 seconds locally on Windows 11, and the same
# step took nine seconds on run 35528077325 earlier the same day, so this is not
# slowness. Dropping DnaEntropyGraph.App.UiTests, the only WinUI-app-hosted test
# assembly, did not fix it, which rules out the obvious first suspect. Turning this on
# for pull requests before that is understood would put a check that never finishes in
# front of every PR, which is worse than running it by hand. Restore the block below
# once a run of it completes:
#
#   on:
#     pull_request:
#       paths:
#         - "app/**"
#         - ".github/workflows/ci-app.yml"
#     workflow_dispatch:
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      # The soft gate that used to stand here ("does app/DnaEntropyGraph.sln
      # exist?", notice-and-pass if not) is gone. The solution landed with
      # issue #61 and run 35448261797 executed every step below against it for
      # real, which is the confirmation `scripts/check_guard_drift.py` asks for
      # before a notice-mode gate is simplified away. Leaving it in would mean a
      # future accidental deletion of the solution turns this job green instead
      # of red, which is the failure the guard exists to prevent.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: app/global.json

      - name: restore
        working-directory: app
        run: dotnet restore

      - name: format
        working-directory: app
        run: dotnet format --verify-no-changes --no-restore

      - name: build
        working-directory: app
        run: dotnet build -c Release -p:Platform=x64 --no-restore -warnaserror

      # MEASURED 2026-09-19 (run 35448261797): this step used to carry
      # `--filter "FullyQualifiedName!~UiTests"`, `--logger "trx;..."` and
      # `--collect:"XPlat Code Coverage"`. All three are **VSTest** options, and
      # these projects run on xunit.v3 / Microsoft.Testing.Platform, where the
      # runner does not recognise them and bails: every one of the six test
      # assemblies reported "Zero tests ran", exit code 5. The job went red for
      # the right reason, but it had never run a single test, and an exit code
      # of 0 there would have been a permanently green job testing nothing.
      #
      # TRX and coverage need the Microsoft.Testing.Extensions.* packages
      # referenced first -- see the follow-up issue; passing the flags without
      # them reproduces the same "Zero tests ran" failure.
      #
      # MEASURED 2026-09-20: a solution-wide `dotnet test` hung at this step on
      # windows-latest, twice in a row (runs 35528323292 and 35529823866, both
      # cancelled by hand after the step had been running for over twenty
      # minutes; the step takes nine seconds when it works, and twenty-five
      # seconds locally). Every test assembly here is a plain library except
      # DnaEntropyGraph.App.UiTests, which is WinUI-app-hosted, so the runner
      # starts a real desktop app inside a session that has no interactive
      # desktop. Every test in it is `[Fact(Skip=...)]` today, so naming the
      # five library projects explicitly loses no coverage at all and removes
      # the only thing in the run that opens a window. Put UiTests back the day
      # it has a test that does something, together with whatever makes it
      # terminate on a runner.
      - name: test
        working-directory: app
        run: |
          dotnet test tests/DnaEntropyGraph.Core.Tests/DnaEntropyGraph.Core.Tests.csproj -c Release -p:Platform=x64 --no-build
          dotnet test tests/DnaEntropyGraph.Cloud.Tests/DnaEntropyGraph.Cloud.Tests.csproj -c Release -p:Platform=x64 --no-build
          dotnet test tests/DnaEntropyGraph.Persistence.Tests/DnaEntropyGraph.Persistence.Tests.csproj -c Release -p:Platform=x64 --no-build
          dotnet test tests/DnaEntropyGraph.Presentation.Tests/DnaEntropyGraph.Presentation.Tests.csproj -c Release -p:Platform=x64 --no-build
          dotnet test tests/DnaEntropyGraph.Guards.Tests/DnaEntropyGraph.Guards.Tests.csproj -c Release -p:Platform=x64 --no-build

      - name: publish self-contained
        working-directory: app
        run: >
          dotnet publish src/DnaEntropyGraph.App/DnaEntropyGraph.App.csproj
          -c Release -p:Platform=x64 -r win-x64 --self-contained true
          -o publish

      # Unsigned. Signing happens only in release.yml, which asserts its secrets exist.
      #
      # MEASURED 2026-09-20 (run 35528077325, the first pull-request run of this
      # workflow): --packVersion was 0.0.0-ci and vpk 1.2.0 refused it outright with
      # "Invalid package version '0.0.0-ci', it must be >= 0.0.1". Every step before this
      # one passed, so the pack was the only thing between a green job and a red one, and
      # nothing about it is release-specific: this artifact is a throwaway uploaded for
      # seven days and never published. 0.0.1 is the lowest version vpk will take, and the
      # run number keeps two runs of the same commit from producing the same package id.
      - name: vpk pack (unsigned)
        working-directory: app
        run: |
          dotnet tool install -g vpk
          vpk pack --packId DnaEntropyGraph --packVersion 0.0.1-ci.${{ github.run_number }} --packDir publish --outputDir releases

      - uses: actions/upload-artifact@v7
        with:
          name: installer-unsigned
          path: app/releases/**
          retention-days: 7
          if-no-files-found: ignore
