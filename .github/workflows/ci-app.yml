name: ci-app

# Runs on every pull request that touches app/ (or this file), plus on demand:
#
#     gh workflow run ci-app.yml
#     gh run watch
#
# This workflow was kept off pull requests for a while because its `test` step hung on
# windows-latest. MEASURED 2026-09-20: three runs, all cancelled by hand after the step had
# been running for between six and twenty-five minutes (35528323292 and 35529823866
# solution-wide, 35530219025 five library projects), while the same commands take about 25
# seconds locally. MEASURED 2026-10-03 from those logs: in run 35530219025 the first four
# assemblies each passed in 1 to 2 seconds and the fifth, DnaEntropyGraph.Guards.Tests,
# printed "Running tests from ..." and then nothing for 5m 23s until the cancel; the
# orphan-process list at cleanup names DnaEntropyGraph.Guards.Tests in runs 35529823866 and
# 35530219025 (and App.UiTests in 35529823866 only). So the hang is inside Guards.Tests,
# not "the test step in general". The same assembly passed in 2.4 s on run 35528077325
# (headSha 1f1a0f0); the commits between that and the first hung run added
# StringResourceKeyGuardTests, and nothing in them reads as a blocking call, so the exact
# test is THEORY (unverified) and the logs cannot name it: MTP prints nothing per test.
#
# What this file now guarantees instead of a diagnosis (#438): every assembly is run on its
# own with a Microsoft.Testing.Extensions.HangDump timeout of 4 minutes, so a hang ends in
# exit code 7 with a .dmp and a .log naming the process, never a silent wait; a TRX is
# written per assembly; the whole step has timeout-minutes 20; and the results folder is
# uploaded as an artifact on failure or cancel. If this hangs again, open the artifact.
on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/ci-app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build and test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The soft gate that used to stand here ("does app/DnaEntropyGraph.sln
      # exist?", notice-and-pass if not) is gone. The solution landed with
      # issue #61 and run 35448261797 executed every step below against it for
      # real, which is the confirmation `scripts/check_guard_drift.py` asks for
      # before a notice-mode gate is simplified away. Leaving it in would mean a
      # future accidental deletion of the solution turns this job green instead
      # of red, which is the failure the guard exists to prevent.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: app/global.json

      # #438. MEASURED 2026-10-03 (minidump of PR #529's run): the hung test was blocked in the Windows App SDK
      # bootstrap (MddBootstrapInitialize2) because windows-latest has no Windows App Runtime, and the default
      # bootstrap option opens a dialog nobody can answer. DnaEntropyGraph.App.csproj now sets option None (a missing
      # runtime exits with an HRESULT instead of hanging). MEASURED 2026-10-03 on a laptop: the bootstrap cannot be
      # disabled for the tests either (COMException 0x80040154 in Guards DiResolutionTests), so this step installs the
      # runtime and the next one asserts it is there, so a silent --quiet no-op fails here and not as a test error.
      # THEORY (unverified) until a run shows it: that the redistributable installs silently on windows-latest; see docs/ToTest.md.
      - name: install Windows App Runtime
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri https://aka.ms/windowsappsdk/1.8/latest/windowsappruntimeinstall-x64.exe -OutFile "$env:RUNNER_TEMP/windowsappruntimeinstall.exe"
          $p = Start-Process -FilePath "$env:RUNNER_TEMP/windowsappruntimeinstall.exe" -ArgumentList '--quiet' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Windows App Runtime install exited $($p.ExitCode)" }

      - name: assert Windows App Runtime 1.8 is installed
        shell: pwsh
        run: |
          $pkgs = Get-AppxPackage -AllUsers 'Microsoft.WindowsAppRuntime.1.8*'
          if (-not $pkgs) { throw 'Windows App Runtime 1.8 is not installed after the install step (a silent --quiet no-op).' }
          $pkgs | ForEach-Object { Write-Host "installed: $($_.Name) $($_.Version)" }
      - name: restore
        working-directory: app
        run: dotnet restore

      - name: format
        working-directory: app
        run: dotnet format --verify-no-changes --no-restore

      - name: build
        working-directory: app
        run: dotnet build -c Release -p:Platform=x64 --no-restore -warnaserror

      # MEASURED 2026-09-19 (run 35448261797): this step used to carry
      # `--filter "FullyQualifiedName!~UiTests"`, `--logger "trx;..."` and
      # `--collect:"XPlat Code Coverage"`. All three are **VSTest** options, and
      # these projects run on xunit.v3 / Microsoft.Testing.Platform, where the
      # runner does not recognise them and bails: every one of the six test
      # assemblies reported "Zero tests ran", exit code 5. The job went red for
      # the right reason, but it had never run a single test, and an exit code
      # of 0 there would have been a permanently green job testing nothing.
      #
      # TRX comes from Microsoft.Testing.Extensions.TrxReport and the hang dump from
      # ...HangDump, both referenced by every test project (#438); coverage is not wired.
      #
      # The 2026-09-20 theory that App.UiTests (WinUI-hosted) caused the hang is DISPROVED:
      # run 35530219025 excluded it and still hung, inside Guards.Tests (see the header).
      # UiTests stays out of the list anyway because every test in it is a skip today.
      # #438. Per-assembly so the log says which assembly stalled, and `--hangdump` (MIT,
      # Microsoft.Testing.Extensions.HangDump, referenced by every test project) so a stall
      # is killed with a minidump after 4 minutes instead of waiting for the job timeout.
      # Every project runs even if an earlier one fails, then the step fails once at the end.
      - name: test
        working-directory: app
        timeout-minutes: 20
        shell: pwsh
        run: |
          $failed = @()
          foreach ($p in 'Core', 'Cloud', 'Persistence', 'Presentation', 'Guards') {
            $proj = "tests/DnaEntropyGraph.$p.Tests/DnaEntropyGraph.$p.Tests.csproj"
            Write-Host "::group::$p.Tests"
            dotnet test $proj -c Release -p:Platform=x64 --no-build -- `
              --hangdump --hangdump-timeout 4m --hangdump-type Mini `
              --report-trx --results-directory "$PWD/TestResults/$p"
            if ($LASTEXITCODE -ne 0) { $failed += "$p (exit $LASTEXITCODE)" }
            Write-Host "::endgroup::"
          }
          $trx = @(Get-ChildItem TestResults -Recurse -Filter *.trx -ErrorAction SilentlyContinue)
          if ($trx.Count -lt 5) { $failed += "expected 5 .trx files, found $($trx.Count) (a dropped --report-trx flag)" }
          if ($failed.Count -gt 0) {
            Write-Host "::error title=app tests failed::$($failed -join ', '). Exit 7 means the hang dump fired; download the test-results artifact."
            exit 1
          }

      - name: upload test results (TRX, hang dumps)
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: app/TestResults/**
          retention-days: 7
          if-no-files-found: ignore

      - name: publish self-contained
        working-directory: app
        run: >
          dotnet publish src/DnaEntropyGraph.App/DnaEntropyGraph.App.csproj
          -c Release -p:Platform=x64 -r win-x64 --self-contained true
          -o publish

      # Unsigned. Signing happens only in release.yml, which asserts its secrets exist.
      #
      # MEASURED 2026-09-20 (run 35528077325, the first pull-request run of this
      # workflow): --packVersion was 0.0.0-ci and vpk 1.2.0 refused it outright with
      # "Invalid package version '0.0.0-ci', it must be >= 0.0.1". Every step before this
      # one passed, so the pack was the only thing between a green job and a red one, and
      # nothing about it is release-specific: this artifact is a throwaway uploaded for
      # seven days and never published. 0.0.1 is the lowest version vpk will take, and the
      # run number keeps two runs of the same commit from producing the same package id.
      - name: vpk pack (unsigned)
        working-directory: app
        run: |
          dotnet tool install -g vpk
          vpk pack --packId DnaEntropyGraph --packVersion 0.0.1-ci.${{ github.run_number }} --packDir publish --outputDir releases

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer-unsigned
          path: app/releases/**
          retention-days: 7
          if-no-files-found: ignore
