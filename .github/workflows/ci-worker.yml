name: ci-worker

# Runs on every pull request (the `changes` job skips the real work when nothing under worker/
# or this file changed, see #31 below), plus on demand:
#
#     gh workflow run ci-worker.yml
#     gh run watch
#
# or the "Run workflow" button on the Actions tab. No push trigger and no schedule -
# a PR's own check is the gate, and main only ever gets there through a PR this
# workflow already ran.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # #31: a workflow-level `paths:` filter means the workflow never starts on a PR that
  # touches nothing under worker/, so its checks never appear, and a required status check that
  # never appears stays "Expected - waiting" forever (it blocks the merge button). A job that
  # is skipped by its own `if:` reports as Skipped, which branch protection counts as passing.
  # So: no path filter on the trigger; this tiny job decides, and the real jobs are gated on it.
  # FAIL-OPEN HAZARD (#31 round 2): a job whose `needs` failed is SKIPPED unless its `if:` contains a status function, and a
  # skipped required check reads as green. So a broken `changes` job (outputs.run empty) would skip every real job and turn
  # the PR green with nothing tested. Each gated job therefore uses
  #     !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run == 'true')
  # `!cancelled()` is a status function, so it replaces the implicit success() and the job is evaluated even when `changes`
  # failed; then `result != 'success'` makes a broken gate RUN the tests. A cancelled run (the workflow is being cancelled)
  # still stops, and reads as cancelled, not green. Chosen over a final aggregator job because the required check names stay
  # the real jobs' names. Pinned by scripts/tests/test_ci_changes_gate.py (parses this file's needs/if wiring).  changes:
    name: changes (worker)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # Fail-CLOSED (#31 round 2): the jobs are skipped only when the diff succeeded and EVERY changed path is on a short
      # known-irrelevant list; any git error runs them. Skipped counts as passing for branch protection, so the old inline
      # `git diff | grep -Eq` (no pipefail, rename-collapsing, allowlist-shaped) could turn a broken diff into a green PR.
      # The list and its rules live in scripts/ci_changes_gate.py, pinned by scripts/tests/test_ci_changes_gate.py, which fails
      # when a path a test or a step of this workflow reads would be skipped.
      - name: Does this PR change anything ci-worker cares about?
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 scripts/ci_changes_gate.py --workflow ci-worker --event "$EVENT" --base "$BASE_SHA"

  test:
    name: pytest (not gpu)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true

      # #466 (MEASURED 2026-10-02): this job used to run `uv pip install -e ".[dev,genes]"`, which re-resolves to
      # whatever is newest today and ignores worker/uv.lock, so CI tested versions nobody locked and could go
      # red overnight on an upstream release. Now: fail by name when pyproject.toml and the lock disagree, then
      # install exactly the lock (same extras as the dev box; [evo] is container-only). Python 3.12 is Hard Rule 20.
      - name: Lock file is current (uv lock --check)
        working-directory: worker
        run: uv lock --check

      - name: Create the environment from the lock
        working-directory: worker
        run: uv sync --frozen --python 3.12 --extra dev --extra genes

      # Lint is enabled by the presence of a ruff config, so it starts enforcing
      # the moment worker/pyproject.toml gains a [tool.ruff] table (issue #285).
      - name: Is ruff configured?
        id: ruff-config
        working-directory: worker
        run: |
          if [ -f ruff.toml ] || [ -f .ruff.toml ] || grep -q '^\[tool\.ruff' pyproject.toml; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=ruff not configured::worker/pyproject.toml has no [tool.ruff] table, so lint is skipped. See issue #285."
          fi

      - name: ruff check
        if: steps.ruff-config.outputs.configured == 'true'
        working-directory: worker
        run: uvx ruff check .

      - name: ruff format --check
        if: steps.ruff-config.outputs.configured == 'true'
        working-directory: worker
        run: uvx ruff format --check .

      - name: pytest
        working-directory: worker
        run: uv run --frozen pytest tests -m "not gpu" -q --junitxml=../pytest-worker.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-worker
          path: pytest-worker.xml
          retention-days: 7
          if-no-files-found: ignore

  build:
    name: sdist and wheel
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - name: uv build
        working-directory: worker
        run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-dist
          path: worker/dist/*
          retention-days: 7

  contract:
    name: manifest schema and startup script
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.run == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0

      # Unconditional since #39 landed the script. A missing file now fails the step
      # loudly instead of reverting to notice-and-pass, which is what
      # scripts/check_guard_drift.py exists to catch.
      # MEASURED 2026-09-19: this step used to run with `--with jsonschema` alone, and
      # broke the moment worker/manifest.py started importing predictors.hardware to
      # validate a model id -- that pulls predictors/__init__.py, which imports numpy,
      # and the step died with ModuleNotFoundError rather than with a drift report.
      # The generator introspects the worker's own dataclasses, so its dependency
      # footprint is the worker's, not a hand-maintained subset: install the package
      # itself and the next transitive import cannot break this step again.
      - name: manifest schema drift
        run: uv run --with jsonschema --with-editable ./worker python scripts/gen_manifest_schema.py --check

      # Unconditional since #45 landed the script.
      - name: shellcheck the VM startup script
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck worker/vm/startup.sh

      # Unconditional since #36 landed the Dockerfile. Dockerfile.cuda is not built here:
      # it needs an NVIDIA base and a GPU runtime, and is marked UNVERIFIED in the file.
      - name: CPU container smoke
        run: |
          docker build -f worker/Dockerfile.cpu -t dna-entropy-worker:cpu worker
          docker run --rm dna-entropy-worker:cpu dna-entropy-worker selftest
