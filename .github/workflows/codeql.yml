name: codeql

# CI runs ON DEMAND ONLY (owner's decision, 2026-09-19). Start a run with:
#
#     gh workflow run codeql.yml
#     gh run watch
#
# or the "Run workflow" button on the Actions tab. Nothing here fires on a push, a pull
# request or a schedule.
#
# To restore automatic CI, delete `workflow_dispatch:` below and uncomment this block:
#
#   on:
#     pull_request:
#       branches: [main]
#     push:
#       branches: [main]
#     schedule:
#       # Weekly, so a new advisory is found without waiting for the next PR.
#       - cron: "17 3 * * 1"
#     workflow_dispatch:
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze ${{ matrix.language }}
    runs-on: ${{ matrix.language == 'csharp' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 60
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # csharp added 2026-09-19 (issue #197): #61 closed, app/DnaEntropyGraph.sln exists
        # and every lane's dotnet build already runs against it for real.
        language: [python, actions, csharp]
    steps:
      - uses: actions/checkout@v7

      # csharp only: CodeQL's autobuild heuristic is not reliable for an unpackaged,
      # x64-platform, central-package-managed WinUI 3 solution (Directory.Build.props,
      # global.json's pinned SDK) - an explicit restore+build mirrors ci-app.yml's own
      # working build step instead of hoping autobuild guesses the same invocation.
      - uses: actions/setup-dotnet@v6
        if: matrix.language == 'csharp'
        with:
          global-json-file: app/global.json

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: build (csharp)
        if: matrix.language == 'csharp'
        working-directory: app
        run: |
          dotnet restore
          dotnet build -c Release -p:Platform=x64 --no-restore

      - uses: github/codeql-action/autobuild@v3
        if: matrix.language != 'csharp'

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    # Two reasons this does not run today, both deliberate and both recorded.
    #
    # 1. The action needs a pull-request context, and this workflow is dispatch-only, so
    #    the condition below is never true. It skips rather than failing.
    # 2. Even on a real PR it errors before it starts, because Dependency graph is not
    #    enabled on this repository. That is an owner action, filed as #325, and it is
    #    not a version problem: v4 and v5 fail identically. Observed on PR #305, where
    #    this was the only red check while every substantive job passed.
    #
    # Restoring the pull-request trigger without doing #325 first re-creates a check that
    # is always red, which is how people learn to merge past red checks.
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # The project ships MIT-licensed software and vendors igv.js (MIT).
          # A copyleft dependency is a release blocker, so it fails the PR instead.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-3.0, SSPL-1.0
          comment-summary-in-pr: always
