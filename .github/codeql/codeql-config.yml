name: dna-entropy-graph codeql config

# Donor and prototype copies are not this project's code (legacy/clair is gitignored and
# never committed, see check_repo_hygiene.py); do not report alerts against them.
#
# **/obj/** and **/bin/** are build output (XamlTypeInfo.g.cs, *.xaml.g.cs, ...). NOTE: GitHub
# applies paths-ignore only to interpreted languages and to compiled languages analysed WITHOUT a
# build; the csharp lane builds, so there codeql.yml also filters the SARIF (advanced-security/
# filter-sarif) before upload. See https://docs.github.com/en/code-security/code-scanning/
# creating-an-advanced-setup-for-code-scanning/customizing-your-advanced-setup-for-code-scanning
paths-ignore:
  - legacy/**
  - worker/legacy/**
  - '**/obj/**'
  - '**/bin/**'
  - worker/tests/**
  - scripts/tests/**

# Test trees (pytest) are not shipped code; paths-ignore is honoured for python, so no alert is raised there.
# The csharp equivalent (app/tests/**) is applied by filter-sarif in codeql.yml.
#
# DECISION (agent-made, reversible): cs/path-combine and cs/catch-of-all-exceptions stay ON for product code.
# MEASURED 2026-10-29 (open alerts): 80 product cs/path-combine hits (app/src, app/tools); many join a
# caller- or manifest-supplied segment (relative paths in RunTransfer, RunCloudResults, LocalJobRunner,
# FileName, jobId), so they are the rule's real target and are reviewed, not excluded. 75 product
# cs/catch-of-all-exceptions hits spread over 30+ files, not all top-level. Test-project hits (780 and 4)
# are removed by the build scope and the filter-sarif pattern instead.

# Style-only rules from the security-and-quality suite, triaged as noise in #488 and #491 (each hit
# was read; none was a defect). P/Invoke is how the Windows shell code reaches the OS. Rules that can
# flag a real defect (cs/path-combine, cs/catch-of-all-exceptions, cs/local-not-disposed) stay on.
# DECISION (agent-made, reversible): scripts/check_format_arity.py replaces the CodeQL rule
# cs/invalid-string-formatting (open and dismissed alerts all carry that one id). The product
# ReswStringResourceProvider.GetString returns `key` itself on an empty value and in its catch (the same
# flow source as the test stubs that raised alerts 1383/1417/1466/1467), so CodeQL can still trace a
# placeholder-free key into a correct product string.Format. MEASURED 2026-10-29: 5 open and 38 dismissed
# alerts of that rule; the 5 open ones are all product sites (PrototypeImportViewModel 106/139/142/147,
# HistoryViewModel 313), each a literal or const key that check_format_arity.py resolves and finds
# consistent with its template. THEORY (unverified): the provider fallback is the flow source for those
# five. The script reads the real resw template and is a premerge gate; re-enable the rule if it is retired.
query-filters:
  - exclude:
      id: cs/invalid-string-formatting
  - exclude:
      id: cs/xmldoc/missing-summary
  - exclude:
      id: cs/linq/missed-select
  - exclude:
      id: cs/linq/missed-where
  - exclude:
      id: cs/unmanaged-code
  - exclude:
      id: cs/call-to-unmanaged-code
  - exclude:
      id: py/import-and-import-from
